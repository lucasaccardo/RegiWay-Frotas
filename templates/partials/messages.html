{# Exibição de Alertas e Mensagens do Django #}
{% if messages %}
<div class="messages-container">
    {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}" id="alert-{{ forloop.counter }}">
            {% if message.tags == 'success' %}
                <i class="ph ph-check-circle" style="font-size: 1.5rem;"></i>
            {% elif message.tags == 'error' or message.tags == 'danger' %}
                <i class="ph ph-warning-circle" style="font-size: 1.5rem;"></i>
            {% elif message.tags == 'warning' %}
                <i class="ph ph-warning" style="font-size: 1.5rem;"></i>
            {% else %}
                <i class="ph ph-info" style="font-size: 1.5rem;"></i>
            {% endif %}
            
            <span class="alert-content">{{ message }}</span>
            
            <button type="button" class="btn-close-alert" onclick="closeAlert('alert-{{ forloop.counter }}')">
                <i class="ph ph-x"></i>
            </button>
        </div>
    {% endfor %}
</div>

<script>
    function closeAlert(alertId) {
        const alertElement = document.getElementById(alertId);
        if (alertElement) {
            alertElement.classList.add('fade-out');
            setTimeout(() => {
                alertElement.style.display = 'none';
            }, 400);
        }
    }
</script>
{% endif %}
